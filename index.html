<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Marwa ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS : Le Style --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex; /* Utilisation de Flexbox pour centrer le contenu */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffdde1; /* Couleur de fond de secours */
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* Empêche le scroll si le bouton sort un peu */
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        h1 {
            color: #ff4d6d;
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin-bottom: 30px;
            padding: 0 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        #monkey-photo {
            /* La largeur max est de 100% du conteneur, mais jamais plus de 300px */
            /* Tu peux ajuster le "300px" selon tes goûts */
            max-width: 90%; 
            width: 300px; 
            height: auto; /* Garde les proportions de l'image */
            border-radius: 20px; /* Arrondit les angles pour un look plus doux */
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); /* Une petite ombre portée */
            margin-bottom: 20px; /* Espace entre la photo et la question */
            object-fit: cover; /* S'assure que l'image remplit bien le cadre si tu fixes une hauteur */
        }

        /* Style pour le GIF de fin */
        #gif-fin {
            max-width: 100%; /* S'adapte à la largeur de l'écran */
            width: 250px;    /* Taille idéale sur PC */
            height: auto;    /* Garde les proportions */
            border-radius: 15px; /* Coins arrondis */
            margin-top: 15px;    /* Espace avec le texte */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* Petite ombre esthétique */
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative; /* Important pour le contexte du bouton Non */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-oui {
            background-color: #4CAF50; /* Vert */
            color: white;
        }

        #btn-oui:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        #btn-non {
            background-color: #ff4d6d; /* Rouge/Rose */
            color: white;
            position: relative; /* Nécessaire pour le déplacer */
        }

        /* Style du texte de persuasion */
        #msg-persuasion {
            color: #d6336c;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            animation: fadeIn 0.5s;
        }

        /* L'animation de secousse + agrandissement */
        @keyframes shake-grow {
            0% { transform: scale(1.5) rotate(0deg); }
            25% { transform: scale(1.5) rotate(-5deg); }
            50% { transform: scale(1.5) rotate(5deg); }
            75% { transform: scale(1.5) rotate(-5deg); }
            100% { transform: scale(1.5) rotate(0deg); }
        }

        /* La classe qu'on va ajouter via JavaScript */
        .gros-et-secoue {
            /* On force la taille et l'animation */
            transform: scale(1.5); 
            animation: shake-grow 0.5s infinite; /* "infinite" pour qu'il bouge tout le temps */
            background-color: #4CAF50 !important; /* On le rend un peu plus rouge pour attirer l'oeil */
            z-index: 100; /* Passe devant tout le reste */
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6) !important; /* Un halo lumineux */
        }

        /* Classe pour cacher les éléments après le "Oui" */
        .hidden {
            display: none !important;
        }

        /* Style du message final */
        #message-final {
            font-size: 1.5rem;
            color: #d6336c;
            font-weight: bold;
            padding: 20px;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive (Mobile) --- */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            button { padding: 12px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    
    <audio id="ma-musique" loop>
        <source src="nintendogs.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <audio id="son-victoire">
        <source src="win.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img src="monkey.png" alt="Photo Monkey" id="monkey-photo">
        
        <h1 id="question">Marwa est ce que tu veux être ma Valentine ?</h1>

        <div class="buttons" id="btn-group">
            <button id="btn-oui">Oui</button>
            <button id="btn-non">Non</button>
        </div>

        <p id="msg-persuasion" class="hidden">T'es sûre que tu ne veux pas dire Oui ? 🤔</p>

        <div id="message-final" class="hidden">
            Je savais que tu dirais oui hehehe!!! <br>
            On va passer une super Saint Valentin ensemble !!! <br>
            Je t'aime ma choubidouwap 🐠

            <br><br> <img src="cat-tongue.gif" alt="GIF chat" id="gif-fin">
        </div>
    </div>

    <script>
        /* --- JavaScript : La Logique --- */
        const btnOui = document.getElementById('btn-oui');
        const btnNon = document.getElementById('btn-non');
        const question = document.getElementById('question');
        const btnGroup = document.getElementById('btn-group');
        const messageFinal = document.getElementById('message-final');
        const photo = document.getElementById('monkey-photo');
        const audio = document.getElementById('ma-musique');
        const audioVictoire = document.getElementById('son-victoire');
        const msgPersuasion = document.getElementById('msg-persuasion');

        // Variable pour savoir si la musique a déjà démarré
        let musiqueDemarree = false;
        let tentatives = 0; // Compteur d'essais sur le NON

        // Fonction pour lancer la musique proprement
        function lancerMusique() {
            if (!musiqueDemarree) {
                audio.volume = 0.5; // Volume à 50%
                audio.play().then(() => {
                    musiqueDemarree = true;
                }).catch(error => {
                    console.log("Le navigateur a bloqué le son au survol (protection anti-bruit).");
                });
            }
        }

        // Fonction pour déplacer le bouton Non
        function fuir() {
            // C'est ici ! Dès qu'on essaie d'attraper le bouton, on lance la musique
            lancerMusique();

            // --- NOUVEAU : Logique du compteur ---
            tentatives++; // On ajoute +1 au compteur
            
            if (tentatives === 5) {
                // Au bout de 10 essais :
                // 1. On ajoute la classe CSS spéciale au bouton OUI
                btnOui.classList.add('gros-et-secoue');
                // 2. On affiche le texte de persuasion
                msgPersuasion.classList.remove('hidden');
            }

            const largeurFenetre = window.innerWidth;
            const hauteurFenetre = window.innerHeight;
            const largeurBtn = btnNon.offsetWidth;
            const hauteurBtn = btnNon.offsetHeight;

            const nouvX = Math.random() * (largeurFenetre - largeurBtn - 50);
            const nouvY = Math.random() * (hauteurFenetre - hauteurBtn - 50);

            btnNon.style.position = "fixed";
            btnNon.style.left = nouvX + "px";
            btnNon.style.top = nouvY + "px";
        }

        // Événements pour le bouton "Non"
        // PC : Dès que la souris approche (survol)
        btnNon.addEventListener('mouseover', fuir);
        
        // Mobile : Dès qu'on essaie de toucher
        btnNon.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            fuir();
        });
        
        // Sécurité clic
        btnNon.addEventListener('click', function(e) {
            e.preventDefault();
            fuir();
        });

        // Événement : Quand on clique sur "Oui"
        btnOui.addEventListener('click', function() {
            // On lance aussi la musique ici, au cas où elle n'aurait pas démarré avant
            lancerMusique();

            audioVictoire.volume = 1.0; // Volume à fond !
            audioVictoire.play();

            question.classList.add('hidden');
            btnGroup.classList.add('hidden');
            if(photo) photo.classList.add('hidden'); // Cache la photo si elle existe
            msgPersuasion.classList.add('hidden');
            
            btnNon.style.display = 'none';
            messageFinal.classList.remove('hidden');
            
            document.body.style.backgroundColor = "#ffdde1";
            document.body.style.background = "radial-gradient(circle, #fce4ec 0%, #f8bbd0 100%)";
            
            lancerConfettis();
        });

        function lancerConfettis() {
            // On augmente un peu le nombre de cœurs pour l'effet de profondeur (passons à 80)
            for(let i=0; i<80; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                
                // --- NOUVEAU : Gestion de la profondeur (Z-Index) ---
                // Math.random() donne un chiffre entre 0 et 1.
                if (Math.random() < 0.3) {
                    // 30% de chance : Le cœur passe DERRIÈRE (z-index faible)
                    // Le conteneur principal a un z-index de 1, donc on met 0 pour être dessous.
                    heart.style.zIndex = '0'; 
                    // Petite astuce : on les rend un peu plus petits et transparents pour l'effet de lointain
                    heart.style.opacity = '0.7'; 
                    heart.style.fontSize = (Math.random() * 15 + 10) + 'px'; // Plus petits (10-25px)
                } else {
                    // 70% de chance : Le cœur passe DEVANT (z-index élevé)
                    heart.style.zIndex = '100'; // 100 est largement au-dessus de tout le reste
                    heart.style.opacity = '1';
                    heart.style.fontSize = (Math.random() * 25 + 20) + 'px'; // Plus gros (20-45px)
                }
                // ----------------------------------------------------

                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-10vh';
                // On varie un peu la vitesse aussi (entre 3s et 7s)
                heart.style.animation = `tomber ${Math.random() * 4 + 3}s linear`;
                document.body.appendChild(heart);
            }
            
            // (Le reste ne change pas, on vérifie juste que le style n'existe pas déjà)
            if (!document.getElementById('style-confettis')) {
                const styleSheet = document.createElement("style");
                styleSheet.id = 'style-confettis';
                styleSheet.innerText = `
                    @keyframes tomber {
                        to { transform: translateY(110vh) rotate(360deg); }
                    }
                `;
                document.head.appendChild(styleSheet);
            }
        }
    </script>
</body>

</html>
